<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Admin Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="container login-wrapper">
        <div class="glass-panel login-card">
            <h1><span class="text-aurora">AURORA</span> ADMIN</h1>
            <p style="margin-bottom: 2rem; color: var(--text-secondary);">Restricted Access Protocol</p>

            <a href="/api/admin/auth/google" style="text-decoration: none;">
                <button class="btn btn-google" style="width: 100%;">
                    Login with Google
                </button>
            </a>

            <p style="margin-top: 1.5rem; font-size: 0.85rem; color: #666;">
                Only authorized personnel may proceed.<br>
                All access is logged.
            </p>
        </div>
    </div>
</body>

</html>
